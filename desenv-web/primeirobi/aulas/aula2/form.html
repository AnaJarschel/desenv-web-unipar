<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Formulário</title>
</head>

<body>
    <fieldset>
        <legend>Se increva para receber a nossa Newsletter!</legend>
        <h3>Registre-se, para realizar o seu cadastro .</h3>
        <form action="http://localhost:8081/register" method="post">

            <label for="nome">Digite seu Nome:</label>
            <input type="text" id="nome" name="nome" 
                title="Informe o seu nome completo"
                pattern="[A-Za-z ]+"
                placeholder="Nome" required>
            <br>

            <label for="telefone">Digite seu Telefone:</label>
            <input type="telefone" id="telefone" name="telefone" 
                placeholder="Telefone" required>

            <br>

            <label for="email">Digite seu E-mail:</label>
            <input type="email" id="email" name="email" 
                placeholder="E-mail" required>

            <br>
            <label for="comentario">Gostaria de deixar algum comentário:</label>
            <br>
            <textarea name="comentario" id="comentario" 
                rows="6" cols="26" style="resize: none;">
            </textarea>
            <br>

            <label for="receber">Selecione a maneira que gostaria de receber nossas notícias</label>
            <br>
            <select name="receber" id="receber">
                <option value="" selected disabled >Selecione</option>
                <optgroup label="Pelo WhatsApp">
                    <option value="Individual">Individual</option>
                    <option value="Grupo">Grupo</option>
                </optgroup>
                <optgroup label="Pelo E-mail">
                    <option value="E-mail Padrao">E-mail Padrão</option>
                    <option value="E-mail Geral">E-mail (noticias e muito mais)</option>
                </optgroup>
            </select>

            <br>
            <br>
            <input type="submit" value="Cadastrar">
        </form>
    </fieldset>
</body>
</html>
